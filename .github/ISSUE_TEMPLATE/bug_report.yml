name: Bug report
description: Something in TLI Toolkit doesn't work as it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The easiest way: in the app, open **Settings → About → Report a bug**. It opens this form with the version, Windows version, language and diagnostics boxes already filled in. Nothing is sent until you press **Submit new issue** here.

        Please do not paste character names, account ids or IP addresses. The diagnostics report already has your user folder taken out.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About, next to the name (for example 0.1.0-beta.25).
      placeholder: "0.1.0-beta.25"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Filled in by the app. By hand, press Win+R and run winver.
      placeholder: "win32 x64 (10.0.22631)"
  - type: input
    id: language
    attributes:
      label: App language
      placeholder: "en"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Settings → About → Diagnostics → Copy report. Filled in by Report a bug (cut if it was long: paste the rest from Copy report).
      render: text
    validations:
      required: false
  - type: textarea
    id: frames
    attributes:
      label: Screenshots or frames (optional)
      description: For a screen-reading problem, drag the saved frame (Save frame in the advisor) or a screenshot of the game here. A frame may show your screen: crop out anything private.
    validations:
      required: false
